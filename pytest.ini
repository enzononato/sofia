[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# tests/integration/ needs a real Postgres (docker-compose) and is excluded
# from the default `pytest tests/` / bare `pytest` run via --ignore, so the
# pure/in-memory suite's behavior and count are never affected by it.
# Run the integration suite explicitly:  pytest tests/integration -q
# (see tests/integration/conftest.py for full setup instructions).
addopts = --ignore=tests/integration
markers =
    integration: integration tests that hit a real Postgres DB via httpx.AsyncClient + ASGITransport (not collected by default — see addopts)
